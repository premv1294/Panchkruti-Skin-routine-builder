kind = "web"
previewPath = "/guide"
title = "Panchkruti Skin Guide"
description = "Concern-led skincare guidance, product knowledge and AM/PM routines."
version = "1.0.0"
id = "panchkruti-skin-guide"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 20041

[services.development]
run = "pnpm dev --host 0.0.0.0"

[services.production]
build = ["pnpm", "build"]
serve = "static"
publicDir = "dist/public"

[services.env]
PORT = "20041"
BASE_PATH = "/"
